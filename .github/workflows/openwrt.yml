name: Build OpenWrt packages

on:
  push:
    branches:
      - openwrt
    paths:
      - 'twitch-drops-miner/**'
      - 'luci-app-twitchdropsminer/**'
      - 'headless.py'
      - 'main.py'
      - 'twitch.py'
      - 'utils.py'
      - 'constants.py'
      - 'settings.py'
      - 'translate.py'
      - 'version.py'
      - '.github/workflows/openwrt.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (leave empty to only build)'
        required: false
        default: ''
      text:
        description: 'Release notes'
        required: false
        default: ''

env:
  TZ: UTC

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          # the target device (RK3566) uses aarch64_generic
          - aarch64_generic
        sdk:
          # 25.12.x uses apk; 24.10.x uses opkg (kept for completeness)
          - 25.12.5
          - 24.10.8

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # NOTE: there used to be an `actions/cache` step here caching
      # /opt/openwrt-sdk-<arch>-<sdk>. That path is never created by anything -
      # gh-action-sdk unpacks the SDK *inside* the container image at /builder -
      # so it always reported "Cache not found" (and "Path Validation Error" on
      # save). It was removed rather than fixed: what makes the build slow lives
      # inside an ephemeral container and cannot be cached from the host.

      - name: Fetch the SDK container entrypoint
        run: |
          # We use gh-action-sdk only for its entrypoint.sh - the script that drives
          # feeds update/install and the package build inside the container. We do
          # not use the action itself, because its `docker run` is hardcoded and
          # gives us no way to stop setup.sh from re-downloading the SDK.
          git clone --depth 1 https://github.com/openwrt/gh-action-sdk "$RUNNER_TEMP/gh-action-sdk"
          # Pinned for reproducibility; bump deliberately.
          git -C "$RUNNER_TEMP/gh-action-sdk" checkout --quiet f5813d30eeef3534b58ac7e79c5d8842b6035434

      # The SDK builds CPython, OpenSSL and their dependency closure from source,
      # but most of that work exists only to *build itself* - it is never part of
      # the uploaded artifacts. This script is injected inside the container after
      # `feeds update -a` (feed Makefiles now exist) and before `make defconfig`
      # (compile graph not built yet); see docs/openwrt/07-native-feasibility.md.
      - name: Write the build-shrink patch script
        run: |
          cat > "$RUNNER_TEMP/shrink-feeds.sh" <<'SHRINK'
          #!/bin/bash
          # Only build-time packages that are never uploaded are touched:
          #   - python3: the router runs the python3 from its own feeds, so drop
          #     PGO (~9 min) and bluez (build-only dep of CPython's _bluetooth;
          #     no python3-* package ships it).
          #   - openssl: its optional engines depend on kernel kmods
          #     (kmod-cryptodev -> a full kernel build). We never ship openssl,
          #     so force the engines off and make their packaging tolerate the
          #     resulting missing .so files.
          set -e
          PY=/builder/feeds/packages/lang/python/python3/Makefile
          SSL=/builder/feeds/base_root/package/libs/openssl/Makefile
          OM=/builder/include/openssl-module.mk
          CFG=/builder/.config

          if [ -f "$PY" ]; then
            echo "[shrink] python3: drop PGO (--enable-optimizations)"
            sed -i '/--enable-optimizations/d' "$PY"
            echo "[shrink] python3: drop bluez from PKG_BUILD_DEPENDS"
            sed -i -E 's/^(PKG_BUILD_DEPENDS):=bluez[[:space:]]+/\1:=/' "$PY"
          fi

          if [ -f "$SSL" ]; then
            echo "[shrink] openssl: drop optional engine deps on kernel kmods"
            # '-' must be in the character class (PACKAGE_libopenssl-devcrypto).
            sed -i -E 's/\+[A-Za-z0-9_-]*:kmod-(cryptodev|crypto-user|crypto-hw-padlock)//g' "$SSL"
            echo "[shrink] openssl: force the engines off (devcrypto needs crypto/cryptodev.h)"
            sed -i 's/OPENSSL_OPTIONS:= shared no-tests/OPENSSL_OPTIONS:= shared no-tests no-devcryptoeng no-afalgeng no-padlockeng/' "$SSL"
            sed -i 's/OPENSSL_OPTIONS += enable-devcryptoeng/OPENSSL_OPTIONS += no-devcryptoeng/g' "$SSL"
            echo "[shrink] openssl: reindex feeds"
            ./scripts/feeds update -i
          fi

          # Compiling a source package also packages all of its subpackages, so the
          # engine packages still get an ipk even when unselected.
          if [ -f "$OM" ]; then
            echo "[shrink] openssl: tolerate missing engine .so when packaging"
            sed -i -E '/INSTALL_BIN/s/^([[:space:]]*)/\1-/' "$OM"
          fi

          # The SDK image ships no .config, so append unconditionally; `make defconfig`
          # honours explicit "is not set" lines even when CONFIG_ALL=y.
          {
            echo '# CONFIG_PACKAGE_libopenssl-devcrypto is not set'
            echo '# CONFIG_PACKAGE_libopenssl-afalg is not set'
            echo '# CONFIG_PACKAGE_libopenssl-padlock is not set'
            echo '# CONFIG_OPENSSL_ENGINE_BUILTIN_DEVCRYPTO is not set'
          } >> "$CFG"
          echo "[shrink] done"
          SHRINK
          chmod +x "$RUNNER_TEMP/shrink-feeds.sh"
          # the heredoc above is indented for readability; strip the leading spaces
          sed -i 's/^          //' "$RUNNER_TEMP/shrink-feeds.sh"

      - name: Write the entrypoint wrapper
        run: |
          cat > "$RUNNER_TEMP/entrypoint-wrapper.sh" <<'WRAPPER'
          #!/bin/bash
          # gh-action-sdk's entrypoint runs `[ ! -f setup.sh ] || bash setup.sh`
          # with WORKDIR=/builder, so /builder/setup.sh - which downloads and
          # extracts the official SDK tarball - always runs. Its own comment says
          # snapshot images don't ship the SDK to save bandwidth; for a release
          # image that download is pure waste, because the image already contains
          # a complete SDK (cross toolchain + host tools).
          #
          # Only skip it when the SDK is demonstrably there, so this stays correct
          # for any SDK variant that really does need the download (~5 min saved
          # per build when it applies).
          sdk_present=0
          ls -d /builder/staging_dir/toolchain-* >/dev/null 2>&1 \
            && [ -x /builder/staging_dir/host/bin/mkhash ] \
            && sdk_present=1
          if [ "$sdk_present" = 1 ]; then
            echo "image already ships an SDK - neutralising setup.sh"
            mv /builder/setup.sh /builder/setup.sh.disabled
          else
            echo "no SDK in the image - letting setup.sh download it"
          fi
          # Inject the shrink script between `./scripts/feeds update -a` and
          # `make defconfig`. Write to /tmp: / is not writable for the build user.
          sed 's#^make defconfig$#bash /shrink-feeds.sh\nmake defconfig#' \
            /entrypoint.sh > /tmp/entrypoint-patched.sh
          exec bash /tmp/entrypoint-patched.sh
          WRAPPER
          chmod +x "$RUNNER_TEMP/entrypoint-wrapper.sh"
          # the heredoc above is indented for readability; strip the leading spaces
          sed -i 's/^          //' "$RUNNER_TEMP/entrypoint-wrapper.sh"

      - name: Build packages
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.sdk }}
          FEEDNAME: twitchdropsminer
          # luci-app-twitchdropsminer already depends on twitch-drops-miner
          # (LUCI_DEPENDS), so a single compile pass produces both packages.
          # Listing both would run the whole dependency closure twice.
          PACKAGES: luci-app-twitchdropsminer
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          V: s
        run: |
          # Mirrors what openwrt/gh-action-sdk does, minus the image build and
          # minus the SDK re-download. See docs/openwrt/07-native-feasibility.md.
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          docker run --rm \
            --env BUILD --env BUILD_LOG --env EXTRA_FEEDS --env FEEDNAME \
            --env IGNORE_ERRORS --env KEY_BUILD --env PRIVATE_KEY \
            --env NO_DEFAULT_FEEDS --env NO_REFRESH_CHECK --env NO_SHFMT_CHECK \
            --env PACKAGES --env INDEX --env V \
            -v "$GITHUB_WORKSPACE:/artifacts" \
            -v "$GITHUB_WORKSPACE:/feed" \
            -v "$RUNNER_TEMP/gh-action-sdk/entrypoint.sh:/entrypoint.sh" \
            -v "$RUNNER_TEMP/entrypoint-wrapper.sh:/entrypoint-wrapper.sh" \
            -v "$RUNNER_TEMP/shrink-feeds.sh:/shrink-feeds.sh" \
            --entrypoint /entrypoint-wrapper.sh \
            "ghcr.io/openwrt/sdk:${ARCH}"
          sudo chown -R --reference="$GITHUB_WORKSPACE/.." "$GITHUB_WORKSPACE"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: packages-${{ matrix.arch }}-${{ matrix.sdk }}
          path: bin/packages/${{ matrix.arch }}/twitchdropsminer/*

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body: ${{ github.event.inputs.text }}
          prerelease: true
          files: artifacts/**/*
